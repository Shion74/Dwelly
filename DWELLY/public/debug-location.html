<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Location Extraction</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 10px; width: 100%; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .debug { background: #f8f9fa; border: 1px solid #dee2e6; color: #6c757d; }
        pre { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Location Extraction Debug Tool</h1>
        <p>Use this tool to test the location extraction API directly.</p>
        
        <div class="form-group">
            <label for="mapUrl">Map URL:</label>
            <input type="text" id="mapUrl" placeholder="Paste Google Maps or Apple Maps URL here..." 
                   value="https://www.google.com/maps/place/Mapúa+Malayan+Colleges+Mindanao/@7.0624547,125.5933063,17z">
        </div>
        
        <div class="form-group">
            <button onclick="testExtraction()">🔍 Test Location Extraction</button>
        </div>
        
        <div class="form-group">
            <button onclick="checkAuth()">👤 Check Authentication</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        async function testExtraction() {
            const url = document.getElementById('mapUrl').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!url) {
                showResult('Please enter a map URL first.', 'error');
                return;
            }
            
            showResult('Testing location extraction...', 'debug');
            
            try {
                console.log('Making API request to /api/extract-location');
                console.log('URL:', url);
                
                const response = await fetch('/api/extract-location', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ maps_link: url })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const result = await response.json();
                console.log('Response data:', result);
                
                if (response.ok && result.success) {
                    showResult(`✅ Success!\n\nCoordinates:\nLat: ${result.coordinates.lat}\nLng: ${result.coordinates.lng}\n\nLocation:\n${JSON.stringify(result.location, null, 2)}`, 'success');
                } else {
                    showResult(`❌ API Error (${response.status}):\n${result.error || 'Unknown error'}`, 'error');
                }
                
            } catch (error) {
                console.error('Request failed:', error);
                showResult(`💥 Request Failed:\n${error.message}`, 'error');
            }
        }
        
        async function checkAuth() {
            try {
                const response = await fetch('/auth/check', {
                    method: 'GET',
                    credentials: 'same-origin'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    showResult(`👤 Authentication Status:\n${JSON.stringify(result, null, 2)}`, 'success');
                } else {
                    showResult(`❌ Auth Check Failed (${response.status})`, 'error');
                }
                
            } catch (error) {
                showResult(`💥 Auth Check Error:\n${error.message}`, 'error');
            }
        }
        
        function showResult(message, type) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<div class="result ${type}"><pre>${message}</pre></div>`;
        }
        
        // Show helpful information on load
        document.addEventListener('DOMContentLoaded', () => {
            showResult('Ready to test! Try the buttons above to debug the location extraction.', 'debug');
        });
    </script>
</body>
</html>
